name: Windows build and test

on:
  # Automatic push/PR checks are paused; keep the workflow available on demand.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ListenShelf.slnx

      - name: Build
        run: dotnet build ListenShelf.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ListenShelf.slnx --configuration Release --no-build --no-restore
